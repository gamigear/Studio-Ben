name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lenlich
          POSTGRES_PASSWORD: lenlich
          POSTGRES_DB: lenlich
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lenlich" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: bash -n scripts/cai-dat.sh
      - run: DEBUG=1 python manage.py makemigrations --check --dry-run
      # Chạy test trên PostgreSQL (giống môi trường thật) và SQLite.
      - run: pytest
        env:
          DATABASE_URL: postgres://lenlich:lenlich@localhost:5432/lenlich
      - run: pytest
