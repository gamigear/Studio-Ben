# Chạy: docker compose up -d --build
# Kèm Cloudflare Tunnel (để có https://lenlich.tiepdi.com): docker compose --profile tunnel up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lenlich
      POSTGRES_USER: lenlich
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenlich"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://lenlich:${POSTGRES_PASSWORD}@db:5432/lenlich
      MEDIA_ROOT: /app/media
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    volumes:
      - media_data:/app/media
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python manage.py run_worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://lenlich:${POSTGRES_PASSWORD}@db:5432/lenlich
      MEDIA_ROOT: /app/media
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    volumes:
      - media_data:/app/media
      - ./secrets:/run/secrets:ro
    depends_on:
      - web
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  db_data:
  media_data:
