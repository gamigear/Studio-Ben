{% extends "studio/base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block public %}
<div class="login-page">
  <div class="card login">
    <div class="brand"><span class="brand-mark">L</span><span>Lên Lịch</span></div>
    <p class="muted" style="text-align:center;margin-top:0">Đăng nhập để xem lịch đăng bài.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}<ul class="messages"><li class="error">Sai tên đăng nhập hoặc mật khẩu.</li></ul>{% endif %}
      <div class="field"><label for="id_username">Tên đăng nhập</label>{{ form.username }}</div>
      <div class="field"><label for="id_password">Mật khẩu</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" style="width:100%">Đăng nhập</button>
    </form>
  </div>
</div>
{% endblock %}
