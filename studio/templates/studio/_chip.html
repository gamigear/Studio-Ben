{% load tz %}<a class="chip {{ p.status_class }}" href="{% url 'studio:post_edit' p.pk %}" title="{{ p.channel.name }} · {{ p.video.title }} · {{ p.assignee|default:'chưa giao' }} · {{ p.status_label }}">
  <span class="t">{{ p.scheduled_at|localtime|time:"H:i" }}</span>{% include "studio/_platform.html" with platform=p.channel.platform %}<span class="n">{{ p.channel.name }}</span>{% if show_detail %}<span class="n muted small" style="flex-basis:100%">{{ p.get_post_format_display }} · {{ p.video.title|truncatechars:40 }}{% if p.assignee %} · {{ p.assignee }}{% endif %}</span>{% endif %}
